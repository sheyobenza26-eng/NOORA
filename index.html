```html
<!-- International Interest Form -->

<section id="international-interest">

<h2>
Interested in Ordering from Abroad?
</h2>

<p>

Tell us where you are. We'll let you know when international orders open and help you with shipping options.

</p>

<form
action="https://formspree.io/f/mnpallrq"
method="POST"
class="waitlist-form"
>

<input
type="hidden"
name="form_type"
value="International Order Interest"
>

<input
type="text"
name="name"
placeholder="Your Name"
required
>

<input
type="email"
name="email"
placeholder="Your Email Address"
required
>

<select name="country" required>

<option value="" disabled selected>
Select Your Country
</option>

<option value="Philippines">
🇵🇭 Philippines
</option>

<option value="United States">
🇺🇸 United States
</option>

<option value="Canada">
🇨🇦 Canada
</option>

<option value="United Kingdom">
🇬🇧 United Kingdom
</option>

<option value="United Arab Emirates">
🇦🇪 United Arab Emirates
</option>

<option value="Saudi Arabia">
🇸🇦 Saudi Arabia
</option>

<option value="Qatar">
🇶🇦 Qatar
</option>

<option value="Australia">
🇦🇺 Australia
</option>

<option value="Singapore">
🇸🇬 Singapore
</option>

<option value="Malaysia">
🇲🇾 Malaysia
</option>

<option value="Other">
🌎 Other
</option>

</select>

<input
type="number"
name="quantity"
placeholder="How many sets are you interested in?"
min="1"
required
>

<textarea
name="message"
placeholder="Anything you'd like us to know?"
rows="4">
</textarea>

<button type="submit">
Notify Me About International Orders
</button>

</form>

</section>
```
